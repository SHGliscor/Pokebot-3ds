name: Build Pokebot Gen45 PC melonDS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'pc_gen45/**'
      - '.github/workflows/build-melonds-gen45.yml'

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Pokebot repo
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-enet
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-faad2
            mingw-w64-ucrt-x86_64-lua54
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Generate pret-backed Gen4 data
        run: |
          set -eux
          python pc_gen45/tools/import_pret_gen4.py
          test -s pc_gen45/data/species_gen4.json

      - name: Run PK4 unit tests
        run: |
          set -eux
          cd pc_gen45
          python -m unittest discover -s tests -v

      - name: Fetch pinned melonDS-Lua
        run: |
          set -eux
          git clone https://github.com/Veddy1674/melonDS-lua.git melonDS-lua
          cd melonDS-lua
          git checkout 8d7891ade565fae44256eb0400581517261544aa
          test "$(git rev-parse HEAD)" = "8d7891ade565fae44256eb0400581517261544aa"

      - name: Add Pokebot bulk RAM API
        run: |
          set -eux
          python pc_gen45/tools/apply_melonds_patch.py melonDS-lua
          cp pc_gen45/melonds/pokebot_bridge.lua melonDS-lua/lua/pokebot_bridge.lua
          grep -q 'read_block' melonDS-lua/lua/core/memory.lua
          grep -q 'native.set_function("read_block"' melonDS-lua/src/frontend/qt_sdl/ScriptManager.cpp

      - name: Configure melonDS using prebuilt MSYS2 dependencies
        run: |
          set -eux
          cd melonDS-lua
          cmake -S . -B build-pokebot -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_STATIC=OFF \
            -DLUA_INCLUDE_DIR=/ucrt64/include/lua5.4 \
            -DLUA_LIBRARY=/ucrt64/lib/liblua5.4.dll.a \
            -DENABLE_LTO_RELEASE=OFF \
            -DLUA_INCLUDE_DIR=/ucrt64/include/lua5.4 \
            -DLUA_LIBRARY=/ucrt64/lib/liblua5.4.dll.a

      - name: Build melonDS
        run: |
          set -eux
          cd melonDS-lua
          cmake --build build-pokebot --parallel 4
          test -s build-pokebot/melonDS.exe

      - name: Stage emulator and runtime DLLs
        run: |
          set -eux
          mkdir -p artifact/lua artifact/backend artifact/gen4 artifact/data artifact/pokebot_ipc
          cp melonDS-lua/build-pokebot/melonDS.exe artifact/melonDS.exe

          DEPLOYQT="$(command -v windeployqt6 || command -v windeployqt || true)"
          if [ -n "$DEPLOYQT" ]; then
            "$DEPLOYQT" artifact/melonDS.exe --release --no-translations || true
          fi

          # Copy all non-system UCRT64 DLL dependencies reported by ldd.
          for pass in 1 2 3; do
            ldd artifact/melonDS.exe \
              | awk '/=> \/ucrt64\/bin\// {print $3}' \
              | sort -u \
              | while read -r dll; do
                  [ -f "$dll" ] && cp -n "$dll" artifact/ || true
                done
          done

          cp -R melonDS-lua/lua/core artifact/lua/core
          cp pc_gen45/melonds/pokebot_bridge.lua artifact/lua/pokebot_bridge.lua
          cp pc_gen45/pokebot_gen45.py artifact/
          cp pc_gen45/backend/*.py artifact/backend/
          cp pc_gen45/gen4/*.py artifact/gen4/
          cp pc_gen45/data/species_gen4.json artifact/data/
          cp pc_gen45/README.md artifact/README.md
          cp melonDS-lua/LICENSE artifact/MELONDS_GPLv3_LICENSE.txt

      - name: Add Windows test launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          @echo off
          cd /d "%~dp0"
          python pokebot_gen45.py ping
          pause
          '@ | Set-Content -Encoding ASCII artifact\TEST_BRIDGE.bat

          @'
          @echo off
          cd /d "%~dp0"
          python pokebot_gen45.py scan
          pause
          '@ | Set-Content -Encoding ASCII artifact\SCAN_RAM.bat

          @'
          @echo off
          cd /d "%~dp0"
          python pokebot_gen45.py hgss-starter-check
          pause
          '@ | Set-Content -Encoding ASCII artifact\HEARTGOLD_STARTER_CHECK.bat

          @'
          @echo off
          cd /d "%~dp0"
          python pokebot_gen45.py hgss-starter-hunt
          pause
          '@ | Set-Content -Encoding ASCII artifact\HEARTGOLD_STARTER_HUNTER.bat

          @'
          @echo off
          cd /d "%~dp0"
          python pokebot_gen45.py starter-probe
          pause
          '@ | Set-Content -Encoding ASCII artifact\LEGACY_HEARTGOLD_STARTER_PROBE.bat

          @'
          Pokebot Gen4/5 PC v0p1

          1. Run melonDS.exe and boot HeartGold.
          2. In melonDS load/run lua\pokebot_bridge.lua.
          3. Run TEST_BRIDGE.bat. It should print a Pokebot-melonDS response.
          4. For HGSS starters, save at/near Elm's starter machine.
          5. Open the starter selection screen once and run
             HEARTGOLD_STARTER_CHECK.bat to verify all three are read.
          6. Run HEARTGOLD_STARTER_HUNTER.bat for the automatic shiny loop.
             It checks all three starters before selection and resets if none
             are shiny. It stops before choosing anything when a shiny appears.
          7. SCAN_RAM.bat remains available for RAM diagnostics.

          Target ROM:
          HeartGold Europe v10
          SHA1 EB47AB4BA0326AE842135F62C7EC68CF85C9785F

          This build reads emulated game RAM and injects controller input.
          It does not write Pokemon/game data.
          '@ | Set-Content -Encoding ASCII artifact\FIRST_TEST.txt

          (Get-FileHash artifact\melonDS.exe -Algorithm SHA256).Hash |
            Set-Content artifact\MELONDS_SHA256.txt

      - name: Smoke-check staged files
        run: |
          set -eux
          test -s artifact/melonDS.exe
          test -s artifact/lua/pokebot_bridge.lua
          test -s artifact/pokebot_gen45.py
          ls -lah artifact
          find artifact -maxdepth 2 -type f | sort

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Pokebot-Gen45-PC-HGSS-StarterHunter
          path: artifact/
          if-no-files-found: error
